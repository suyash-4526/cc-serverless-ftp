<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Transfer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --success: #10B981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            margin: 0 0 30px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Drag & Drop Zone */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #F9FAFB;
            margin-bottom: 20px;
        }

        .drop-zone.dragover {
            border-color: var(--primary);
            background-color: #EEF2FF;
        }

        .drop-zone:hover {
            border-color: var(--primary);
        }

        .drop-zone svg {
            width: 50px;
            height: 50px;
            fill: var(--primary);
            margin-bottom: 15px;
        }

        .drop-zone-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
        }

        .drop-zone-subtext {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        #fileInput {
            display: none;
        }

        /* Selected File Preview */
        #filePreview {
            display: none;
            background-color: #F3F4F6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
            word-break: break-all;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #statusText {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: none;
        }

        /* Success Area */
        #successArea {
            display: none;
            margin-top: 20px;
        }

        .success-icon {
            color: var(--success);
            font-size: 40px;
            margin-bottom: 10px;
        }

        .link-box {
            display: flex;
            align-items: center;
            background-color: #F9FAFB;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
        }

        .link-box input {
            flex: 1;
            border: none;
            background: none;
            font-size: 13px;
            color: var(--text-muted);
            outline: none;
        }

        .copy-btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            margin-left: 10px;
        }

        .copy-btn:hover {
            background-color: #374151;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Cloud Transfer</h1>
        <p>Secure, serverless file sharing powered by AWS.</p>
    </div>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <div class="drop-zone-text">Drag & drop your file here</div>
        <div class="drop-zone-subtext">or click to browse from your computer</div>
    </div>
    
    <input type="file" id="fileInput" onchange="handleFileSelect()" />

    <!-- File Preview -->
    <div id="filePreview">No file selected</div>

    <!-- Upload Button -->
    <button class="btn" id="uploadBtn" onclick="uploadFile()" disabled>Upload & Generate Link</button>

    <!-- Loading State -->
    <div style="margin-top: 25px;">
        <div class="loader" id="loader"></div>
        <div id="statusText">Preparing your secure upload...</div>
    </div>

    <!-- Success / Download Area -->
    <div id="successArea">
        <div class="success-icon">✓</div>
        <h3 style="margin: 0; color: #1F2937;">Upload Complete!</h3>
        <p style="font-size: 14px; color: #6B7280; margin-top: 5px;">Your secure link is ready to share.</p>
        
        <div class="link-box">
            <input type="text" id="downloadLinkInput" readonly value="https://example.com/download" />
            <button class="copy-btn" onclick="copyLink()">Copy Link</button>
        </div>
        <div id="copyAlert" style="color: #10B981; font-size: 12px; margin-top: 8px; display: none;">Link copied to clipboard!</div>
    </div>
</div>

<script>
    const API_URL = "https://795058qcki.execute-api.ap-south-1.amazonaws.com"; 
    let selectedFile = null;

    // --- Drag and Drop Logic ---
    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            document.getElementById('fileInput').files = e.dataTransfer.files;
            handleFileSelect();
        }
    });

    // --- UI Update Logic ---
    function handleFileSelect() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length > 0) {
            selectedFile = fileInput.files[0];
            document.getElementById('filePreview').style.display = 'block';
            document.getElementById('filePreview').innerText = `📄 ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('successArea').style.display = 'none';
        }
    }

    function copyLink() {
        const copyText = document.getElementById("downloadLinkInput");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        document.execCommand("copy");
        
        const alertBox = document.getElementById("copyAlert");
        alertBox.style.display = "block";
        setTimeout(() => { alertBox.style.display = "none"; }, 3000);
    }

    // --- Core Upload Logic ---
    async function uploadFile() {
        if (!selectedFile) return;

        const fileType = selectedFile.type || 'application/octet-stream';
        
        // UI Elements
        const statusText = document.getElementById('statusText');
        const loader = document.getElementById('loader');
        const uploadBtn = document.getElementById('uploadBtn');
        const successArea = document.getElementById('successArea');
        const downloadLinkInput = document.getElementById('downloadLinkInput');

        // Set Loading State
        uploadBtn.style.display = "none";
        dropZone.style.display = "none";
        document.getElementById('filePreview').style.display = "none";
        loader.style.display = "block";
        statusText.style.display = "block";
        statusText.innerText = "Step 1/2: Generating secure token...";

        try {
            // 1. Request URL from Lambda
            const response = await fetch(`${API_URL}/upload-url?filename=${encodeURIComponent(selectedFile.name)}&contentType=${encodeURIComponent(fileType)}`);
            const data = await response.json();
            
            statusText.innerText = "Step 2/2: Uploading file to AWS S3...";

            // 2. Upload directly to S3
            const uploadResponse = await fetch(data.uploadUrl, {
                method: 'PUT',
                body: selectedFile,
                headers: {
                    'Content-Type': fileType
                }
            });

            if (uploadResponse.ok) {
                // Success State
                loader.style.display = "none";
                statusText.style.display = "none";
                successArea.style.display = "block";
                
                const fileDownloadUrl = `${API_URL}/download-url?filename=${encodeURIComponent(selectedFile.name)}`;
                downloadLinkInput.value = fileDownloadUrl;
            } else {
                throw new Error(`Upload failed with status: ${uploadResponse.status}`);
            }

        } catch (error) {
            console.error(error);
            loader.style.display = "none";
            statusText.innerText = "❌ An error occurred. Check browser console.";
            statusText.style.color = "red";
            uploadBtn.style.display = "block"; // Show button again so they can retry
        }
    }
</script>

</body>
</html>
